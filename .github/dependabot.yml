version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      # Split prettier MAJOR and MINOR bumps into their own PR: these can reformat
      # the entire codebase, so they must be reviewed on their own rather than
      # bundled into the dev-dependencies group (see #114, where a 3.8.3 -> 3.9.4
      # minor bump rode in unseen). Trivial PATCH bumps are not listed here, so
      # they fall through to the dev-dependencies group and stay batched with
      # other minor/patch updates. Listed first so it wins group-assignment
      # precedence — a dependency joins the first group whose patterns AND
      # update-types both match.
      prettier:
        patterns:
          - prettier
        update-types:
          - major
          - minor
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
